# Publish to npm. Nothing here runs on a push to main: `main` is not a release
# channel, matching primitives-go, primitives-kt and primitives-swift, whose
# ecosystems (Go modules, JitPack, SwiftPM) resolve tags and nothing else.
#
# A release happens when you push a `v*` tag, and only then. The versions that
# go out are whatever is in the package.json files at that tag — `changeset
# publish` skips anything already on the registry — so cutting a release is:
#
#   pnpm changeset version     # or edit versions by hand
#   git commit -am "release: <what shipped>"
#   git tag -a v0.2.0 -m "..." && git push --follow-tags
#
# See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

# Never two publishes at once, and never cancel one midway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # OIDC trusted publishing needs Node >= 22.14
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 still ships npm 10.
      # `changeset publish` shells out to this npm, so upgrading it is enough.
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Never publish off a broken tree. A tag that fails here publishes nothing;
      # fix it on main and cut another tag.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Builds, then publishes ONLY the packages whose version is not already on
      # the registry. Auth is npm Trusted Publishing (OIDC) via `id-token: write`
      # — no NPM_TOKEN secret. Provenance is automatic under trusted publishing.
      #
      # Requires a trusted publisher configured on npm for each package
      # (Settings > Trusted publisher: this repo + `release.yml`), which can only
      # be done after a package's first publish; until then the baseline goes out
      # via scripts/first-publish.sh.
      - name: Publish
        run: pnpm run release
